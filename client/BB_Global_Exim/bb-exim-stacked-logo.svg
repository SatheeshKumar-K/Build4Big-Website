<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" width="500" height="520">
  <defs>
    <!-- Deep Navy & Ocean Blue Gradients -->
    <linearGradient id="navyHullGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Orange / Amber Glow Accent (From Image 1 & 3 Reference) -->
    <linearGradient id="vibrantOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Electric Flight Blue Gradient -->
    <linearGradient id="flightBlue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Globe Sphere Subtle Oceanic Gradient -->
    <radialGradient id="globeSphereGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </radialGradient>

    <filter id="medallionShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Clean Pure White Canvas Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- ==================== TOP CENTER EMBLEM: GLOBE + SHIP + FLIGHT ==================== -->
  <g transform="translate(250, 195)" filter="url(#medallionShadow)">
    <!-- 1. Circular Orbit Trajectory (Dynamic Outer Frame like Reference Images) -->
    <!-- Outer Navy Arc -->
    <path d="M -115 15 C -125 -65, -60 -130, 25 -135 C 95 -140, 145 -95, 140 -20" 
          fill="none" stroke="url(#navyHullGrad)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Inner Vibrant Orange Arc (Sweeping around bottom like Reference Image 1) -->
    <path d="M 125 10 C 135 75, 75 130, -10 135 C -75 140, -125 90, -120 20" 
          fill="none" stroke="url(#vibrantOrange)" stroke-width="8" stroke-linecap="round"/>

    <!-- 2. Earth Globe Sphere inside the Arc -->
    <circle cx="5" cy="-5" r="95" fill="url(#globeSphereGrad)" stroke="#0284C7" stroke-width="2.5"/>
    
    <!-- Latitude Parallels -->
    <ellipse cx="5" cy="-50" rx="78" ry="22" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.6"/>
    <ellipse cx="5" cy="-22" rx="92" ry="26" fill="none" stroke="#0284C7" stroke-width="2" stroke-opacity="0.7"/>
    <ellipse cx="5" cy="10" rx="94" ry="28" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-opacity="0.8"/>
    <ellipse cx="5" cy="42" rx="85" ry="24" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.6"/>

    <!-- Longitude Meridians -->
    <ellipse cx="5" cy="-5" rx="35" ry="95" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.65"/>
    <ellipse cx="5" cy="-5" rx="68" ry="95" fill="none" stroke="#0284C7" stroke-width="1.8" stroke-opacity="0.65"/>
    <line x1="5" y1="-100" x2="5" y2="90" stroke="#0284C7" stroke-width="2" stroke-opacity="0.65"/>

    <!-- 3. Majestic Container Cargo Ship (Center Stage, Forward-Facing Bow like Ref 2 & 3) -->
    <g transform="translate(0, 20)">
      <!-- Ocean Waves at Bow (Cutting through water) -->
      <path d="M -90 42 C -60 35, -30 45, 0 38 C 30 32, 60 42, 90 36" 
            fill="none" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M -65 52 C -40 46, -15 54, 10 48 C 35 44, 60 52, 80 48" 
            fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>

      <!-- Large Ship Hull in Deep Navy Blue -->
      <!-- Sharp cutting bow on right, stern on left -->
      <path d="M -75 36 L 45 36 C 68 36, 82 22, 86 10 L 68 0 L -60 0 Z" 
            fill="url(#navyHullGrad)"/>
      
      <!-- Ship White Waterline Accent -->
      <path d="M -70 30 L 48 30 C 65 30, 75 20, 78 12" 
            fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Stacked Cargo Containers (Vibrant Orange & Navy & Emerald) -->
      <!-- Tier 1 -->
      <rect x="-52" y="-12" width="16" height="11" rx="1.5" fill="url(#vibrantOrange)"/>
      <rect x="-33" y="-12" width="16" height="11" rx="1.5" fill="#1E3A8A"/>
      <rect x="-14" y="-12" width="16" height="11" rx="1.5" fill="url(#vibrantOrange)"/>
      <rect x="5" y="-12" width="16" height="11" rx="1.5" fill="#15803D"/>
      <rect x="24" y="-12" width="16" height="11" rx="1.5" fill="#1E3A8A"/>

      <!-- Tier 2 -->
      <rect x="-44" y="-24" width="16" height="11" rx="1.5" fill="#1E3A8A"/>
      <rect x="-25" y="-24" width="16" height="11" rx="1.5" fill="url(#vibrantOrange)"/>
      <rect x="-6" y="-24" width="16" height="11" rx="1.5" fill="#1E3A8A"/>
      <rect x="13" y="-24" width="16" height="11" rx="1.5" fill="url(#vibrantOrange)"/>

      <!-- Ship Navigation Bridge / Tower at Stern -->
      <path d="M -56 0 L -56 -28 L -46 -28 L -46 0 Z" fill="#0F172A"/>
      <rect x="-54" y="-24" width="6" height="3" fill="#FFFFFF"/>
      <line x1="-51" y1="-28" x2="-51" y2="-36" stroke="#0F172A" stroke-width="2.5"/>
    </g>

    <!-- 4. Soaring Cargo Jet Aircraft (Banking Upwards along Trajectory like Ref 1 & 3) -->
    <g transform="translate(68, -62) rotate(-28)">
      <!-- Airplane Body in Vibrant Orange & Navy Trim -->
      <path d="M 0 -34 
               C 3 -34, 5.5 -28, 6.5 -16 
               L 30 3 
               L 30 10 
               L 6.5 3 
               L 6.5 19 
               L 16 27 
               L 16 33 
               L 0 29 
               L -16 33 
               L -16 27 
               L -6.5 19 
               L -6.5 3 
               L -30 10 
               L -30 3 
               L -6.5 -16 
               C -5.5 -28, -3 -34, 0 -34 Z" 
            fill="url(#vibrantOrange)"/>
      
      <!-- Jet Windshield & Engine Highlights -->
      <ellipse cx="0" cy="-22" rx="3" ry="5" fill="#FFFFFF"/>
      <rect x="12" y="3" width="4" height="7" rx="2" fill="#0F172A"/>
      <rect x="-16" y="3" width="4" height="7" rx="2" fill="#0F172A"/>
    </g>
  </g>

  <!-- ==================== CENTERED TYPOGRAPHY DIRECTLY UNDER EMBLEM ==================== -->
  <!-- Top Line: BB EXIM (Authoritative Bold Brand Title) -->
  <text x="250" y="420" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Montserrat', 'Arial Black', sans-serif" 
        font-size="54" 
        font-weight="900" 
        letter-spacing="4" 
        fill="#0F172A" 
        text-anchor="middle">
    BB EXIM
  </text>

  <!-- Centered Dynamic Accent Bar (Navy & Orange) -->
  <line x1="160" y1="438" x2="340" y2="438" stroke="url(#vibrantOrange)" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="250" cy="438" r="4.5" fill="#0F172A"/>

  <!-- Bottom Line: IMPORT AND EXPORT (Clean Wide Letter-Spaced Subtitle) -->
  <text x="250" y="472" 
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Montserrat', sans-serif" 
        font-size="18" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#0284C7" 
        text-anchor="middle">
    IMPORT &amp; EXPORT
  </text>
</svg>
