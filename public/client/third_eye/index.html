  <style>
    /* Critical Inline Preloader CSS: Instant Display on Refresh */
    #app-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #0B1E36 0%, #050E1A 100%);
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
      overflow: hidden;
    }
    #app-preloader.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .preloader-center {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preloader-glow {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 169, 59, 0.35) 0%, rgba(214, 173, 85, 0.12) 45%, transparent 70%);
      animation: preloaderGlowPulse 2.4s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .preloader-ring-outer {
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 1.5px solid transparent;
      border-top-color: rgba(247, 208, 112, 0.85);
      border-right-color: rgba(229, 169, 59, 0.3);
      animation: preloaderSpin 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .preloader-ring-inner {
      position: absolute;
      width: 95px;
      height: 95px;
      border-radius: 50%;
      border: 1px dashed rgba(229, 169, 59, 0.5);
      animation: preloaderSpinReverse 3.4s linear infinite;
    }
    .preloader-core-icon {
      position: relative;
      z-index: 2;
      width: 74px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: preloaderIconPulse 2.4s ease-in-out infinite;
    }
    .preloader-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(229, 169, 59, 0.75));
    }
    @keyframes preloaderSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes preloaderSpinReverse {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes preloaderGlowPulse {
      0% { transform: scale(0.88); opacity: 0.4; }
      100% { transform: scale(1.25); opacity: 0.85; }
    }
    @keyframes preloaderIconPulse {
      0%, 100% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; filter: drop-shadow(0 0 22px rgba(247, 208, 112, 0.95)); }
    }
  </style>
<style>:root{--gold-primary:#e5a93b;--gold-light:#f7d070;--gold-dark:#c98b20;--gold-glow:rgba(229, 169, 59, .4);--gold-border:rgba(229, 169, 59, .6);--bg-dark:#080b0f;--bg-surface:#0e141c;--bg-card:rgba(18, 24, 34, .75);--bg-card-hover:rgba(26, 35, 49, .85);--text-primary:#ffffff;--text-secondary:#b2bcc9;--text-muted:#748194;--font-heading:"Cinzel", serif;--font-body:"Plus Jakarta Sans", sans-serif;--header-height:80px;--transition-smooth:all .3s cubic-bezier(.25, .8, .25, 1);--border-radius-sm:8px;--border-radius-md:14px;--border-radius-lg:22px;--border-radius-pill:9999px}*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth;font-size:16px;overflow-x:hidden;width:100%;max-width:100vw}body{font-family:var(--font-body);background-color:var(--bg-dark);color:var(--text-primary);line-height:1.6;overflow-x:hidden;width:100%;max-width:100vw;position:relative;-webkit-font-smoothing:antialiased}img{max-width:100%;height:auto;display:block}:root{--jk-bg-primary:#081B35;--jk-bg-secondary:#193653;--jk-gold-highlight:#D6AD55;--jk-gold-light:#ECC875;--jk-gold-dark:#B88E38;--jk-text-ivory:#F5F0E5;--jk-navy-dark:#081B35}@media(max-width:768px){:root{--header-height:70px}}@media(max-width:768px){}</style><link rel="stylesheet" href="styles-V4ZHPYOB.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-V4ZHPYOB.css"></noscript></head>
<body>
  <!-- Clean Luxury Preloader (Strictly ZERO Words - Logo Only) -->
  <div id="app-preloader" aria-hidden="true">
    <div class="preloader-center">
      <div class="preloader-glow"></div>
      <div class="preloader-ring-outer"></div>
      <div class="preloader-ring-inner"></div>
      <div class="preloader-core-icon">
        <img src="assets/images/logo-icon.png" alt="3rd Eye" class="preloader-logo-img">
      </div>
    </div>
  </div>

  <app-root></app-root>

  <script>
    // Smoothly dismiss preloader on window load
    (function() {
      var minTime = 650;
      var start = Date.now();
      function hide() {
        var elapsed = Date.now() - start;
        var delay = Math.max(0, minTime - elapsed);
        setTimeout(function() {
          var p = document.getElementById('app-preloader');
          if (p) {
            p.classList.add('fade-out');
            setTimeout(function() {
              if (p && p.parentNode) p.parentNode.removeChild(p);
            }, 650);
          }
        }, delay);
      }
      if (document.readyState === 'complete') {
        hide();
      } else {
        window.addEventListener('load', hide);
      }
    })();
  </script>
