<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 480" width="100%" height="100%">
  <defs>
    <!-- Rich Gold 3D Gradient -->
    <linearGradient id="fullGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Gold Text Bevel Gradient -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FBBF24" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Vibrant Cyan / Electric Teal Gradient -->
    <linearGradient id="fullCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#008C78" />
    </linearGradient>

    <!-- Arc Gradient -->
    <linearGradient id="fullArcGrad" x1="40%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="25%" stop-color="#10B981" />
      <stop offset="65%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#008C78" />
    </linearGradient>

    <!-- 3D Shadow -->
    <filter id="fullGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#fullGlow)">
    <!-- CENTERED CIRCULAR EMBLEM SCALED (X offset +50) -->
    <g transform="translate(50, 0)">
      <!-- TOP LEAVES -->
      <path d="M 190 75 C 180 40 204 12 228 8 C 231 24 230 48 210 75 Z" fill="url(#fullGoldGrad)" />
      <path d="M 196 68 Q 210 38 228 8" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65" />
      
      <path d="M 174 65 C 138 48 112 38 94 45 C 105 66 134 80 166 76 Z" fill="url(#fullGoldGrad)" />
      <path d="M 166 72 Q 134 60 94 45" stroke="#92400E" stroke-width="1.8" fill="none" opacity="0.6" />

      <path d="M 204 65 C 240 68 274 78 296 94 C 272 105 235 100 200 82 Z" fill="url(#fullGoldGrad)" />
      <path d="M 206 72 Q 248 86 296 94" stroke="#92400E" stroke-width="1.8" fill="none" opacity="0.6" />

      <path d="M 148 85 C 130 98 126 114 133 124 C 146 122 158 106 156 92 Z" fill="url(#fullGoldGrad)" />

      <!-- SWOOPING CIRCULAR ARC -->
      <path d="M 188 75 C 128 92 74 154 72 226 C 70 300 120 358 195 358 C 228 358 260 348 282 334 C 260 341 228 345 195 345 C 134 345 88 294 88 226 C 88 166 134 108 188 75 Z" 
            fill="url(#fullArcGrad)" />

      <!-- HOUSE GABLE ROOF -->
      <path d="M 200 130 L 298 214 L 280 223 L 200 154 L 120 223 L 102 214 Z" fill="url(#fullCyanGrad)" />
      <line x1="200" y1="154" x2="200" y2="178" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 191 192 L 209 192 L 205 180 L 195 180 Z" fill="url(#fullCyanGrad)" />
      <ellipse cx="200" cy="192" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.9" />

      <!-- JK MONOGRAM -->
      <path d="M 138 198 L 195 198 L 195 272 C 195 298 175 316 146 316 C 122 316 108 300 105 285 L 128 280 C 130 289 136 296 146 296 C 160 296 170 287 170 270 L 170 218 L 138 218 Z" fill="url(#fullGoldGrad)" />
      <g transform="translate(150, 222)">
        <path d="M 20 8 L 11 34 M 20 8 L 29 34 M 14 24 L 26 24" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none" />
        <circle cx="20" cy="8" r="3.5" fill="#78350F" />
      </g>

      <rect x="204" y="198" width="26" height="118" rx="2" fill="url(#fullCyanGrad)" />
      <path d="M 228 252 L 282 198 L 307 198 L 250 261 Z" fill="url(#fullCyanGrad)" />
      <rect x="272" y="178" width="30" height="6" rx="1.5" fill="url(#fullCyanGrad)" />
      <rect x="275" y="186" width="24" height="4.5" rx="1" fill="url(#fullCyanGrad)" />
      <rect x="278" y="192" width="18" height="4" rx="1" fill="url(#fullCyanGrad)" />
      <path d="M 238 246 L 302 316 L 272 316 L 220 260 Z" fill="url(#fullCyanGrad)" />
    </g>

    <!-- WORDMARK: INTERIOR -->
    <g id="interior-text">
      <!-- I -->
      <path d="M 38 376 L 66 376 L 66 385 L 56 385 L 56 423 L 66 423 L 66 432 L 38 432 L 38 423 L 48 423 L 48 385 L 38 385 Z" fill="url(#textGold)" />
      <!-- N -->
      <path d="M 74 376 L 94 376 L 120 418 L 120 385 L 112 385 L 112 376 L 130 376 L 130 432 L 112 432 L 84 389 L 84 423 L 94 423 L 94 432 L 74 432 Z" fill="url(#textGold)" />
      <!-- T -->
      <path d="M 138 376 L 182 376 L 182 386 L 174 386 L 174 385 L 165 385 L 165 423 L 174 423 L 174 432 L 146 432 L 146 423 L 155 423 L 155 385 L 146 385 L 146 386 L 138 386 Z" fill="url(#textGold)" />
      <!-- E -->
      <path d="M 190 376 L 228 376 L 228 387 L 218 387 L 201 387 L 201 399 L 220 399 L 220 408 L 201 408 L 201 421 L 220 421 L 230 417 L 230 432 L 190 432 Z" fill="url(#textGold)" />
      <!-- R -->
      <path d="M 236 376 L 268 376 C 279 376 286 382 286 391 C 286 400 279 405 270 407 L 288 432 L 273 432 L 257 409 L 247 409 L 247 423 L 256 423 L 256 432 L 236 432 Z M 247 385 L 247 401 L 265 401 C 271 401 275 398 275 393 C 275 388 271 385 265 385 Z" fill="url(#textGold)" />
      <!-- I -->
      <path d="M 296 376 L 324 376 L 324 385 L 314 385 L 314 423 L 324 423 L 324 432 L 296 432 L 296 423 L 306 423 L 306 385 L 296 385 Z" fill="url(#textGold)" />

      <!-- O (ARCHITECTURAL MOTIF EMBLEM) -->
      <g transform="translate(362, 404)">
        <circle cx="0" cy="0" r="28" fill="none" stroke="url(#fullCyanGrad)" stroke-width="6.5" />
        <circle cx="0" cy="0" r="20" fill="none" stroke="url(#fullCyanGrad)" stroke-width="1.8" opacity="0.6" />
        <!-- Building Peak & Structure -->
        <path d="M 0 -15 L 11 -3 L 7 -3 L 7 13 L -7 13 L -7 -3 L -11 -3 Z" fill="url(#fullCyanGrad)" />
        <line x1="0" y1="-15" x2="0" y2="-24" stroke="url(#fullCyanGrad)" stroke-width="2.8" stroke-linecap="round" />
        <rect x="-3" y="1" width="6" height="8" fill="#FFFFFF" rx="1" opacity="0.9" />
      </g>

      <!-- R -->
      <path d="M 404 376 L 436 376 C 447 376 454 382 454 391 C 454 400 447 405 438 407 L 456 432 L 441 432 L 425 409 L 415 409 L 415 423 L 424 423 L 424 432 L 404 432 Z M 415 385 L 415 401 L 433 401 C 439 401 443 398 443 393 C 443 388 439 385 433 385 Z" fill="url(#textGold)" />
    </g>

    <!-- SUBTITLE: — DESIGNING STUDIO — -->
    <g id="subtitle">
      <line x1="45" y1="460" x2="135" y2="460" stroke="url(#fullCyanGrad)" stroke-width="2.8" stroke-linecap="round" />
      <text x="250" y="465" 
            font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
            font-size="15" 
            font-weight="800" 
            letter-spacing="5" 
            fill="url(#fullCyanGrad)" 
            text-anchor="middle">
        DESIGNING STUDIO
      </text>
      <line x1="365" y1="460" x2="455" y2="460" stroke="url(#fullCyanGrad)" stroke-width="2.8" stroke-linecap="round" />
    </g>
  </g>
</svg>