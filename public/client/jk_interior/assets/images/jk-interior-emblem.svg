<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="100%" height="100%">
  <defs>
    <!-- Rich Gold 3D Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Vibrant Cyan / Electric Teal Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00C9FF" />
      <stop offset="100%" stop-color="#008C78" />
    </linearGradient>

    <!-- Arc Gradient: Gold merging into Electric Cyan/Teal -->
    <linearGradient id="arcGrad" x1="40%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="25%" stop-color="#10B981" />
      <stop offset="65%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#008C78" />
    </linearGradient>

    <!-- 3D Depth Drop Shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- TOP LEAVES -->
    <g id="leaves">
      <!-- Main Upright Center Leaf -->
      <path d="M 190 75 C 180 40 204 12 228 8 C 231 24 230 48 210 75 Z" fill="url(#goldGrad)" />
      <path d="M 196 68 Q 210 38 228 8" stroke="#92400E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.65" />
      
      <!-- Left Leaf -->
      <path d="M 174 65 C 138 48 112 38 94 45 C 105 66 134 80 166 76 Z" fill="url(#goldGrad)" />
      <path d="M 166 72 Q 134 60 94 45" stroke="#92400E" stroke-width="1.8" fill="none" opacity="0.6" />

      <!-- Right Leaf -->
      <path d="M 204 65 C 240 68 274 78 296 94 C 272 105 235 100 200 82 Z" fill="url(#goldGrad)" />
      <path d="M 206 72 Q 248 86 296 94" stroke="#92400E" stroke-width="1.8" fill="none" opacity="0.6" />

      <!-- Small Leaf Bud (Lower Left) -->
      <path d="M 148 85 C 130 98 126 114 133 124 C 146 122 158 106 156 92 Z" fill="url(#goldGrad)" />
    </g>

    <!-- SWOOPING CIRCULAR ARC (Left Enclosure) -->
    <path d="M 188 75 C 128 92 74 154 72 226 C 70 300 120 358 195 358 C 228 358 260 348 282 334 C 260 341 228 345 195 345 C 134 345 88 294 88 226 C 88 166 134 108 188 75 Z" 
          fill="url(#arcGrad)" />

    <!-- HOUSE GABLE ROOF -->
    <g id="house">
      <!-- House Peak -->
      <path d="M 200 130 L 298 214 L 280 223 L 200 154 L 120 223 L 102 214 Z" fill="url(#cyanGrad)" />
      
      <!-- Hanging Pendant Lamp -->
      <line x1="200" y1="154" x2="200" y2="178" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 191 192 L 209 192 L 205 180 L 195 180 Z" fill="url(#cyanGrad)" />
      <ellipse cx="200" cy="192" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- JK MONOGRAM -->
    <g id="monogram">
      <!-- Letter J (Gold with Drafting Compass Tool) -->
      <path d="M 138 198 L 195 198 L 195 272 C 195 298 175 316 146 316 C 122 316 108 300 105 285 L 128 280 C 130 289 136 296 146 296 C 160 296 170 287 170 270 L 170 218 L 138 218 Z" fill="url(#goldGrad)" />
      
      <!-- Drafting Compass / Triangle Tool on J Stem -->
      <g transform="translate(150, 222)">
        <path d="M 20 8 L 11 34 M 20 8 L 29 34 M 14 24 L 26 24" stroke="#78350F" stroke-width="2.4" stroke-linecap="round" fill="none" />
        <circle cx="20" cy="8" r="3.5" fill="#78350F" />
      </g>

      <!-- Letter K (Electric Cyan/Teal with Architectural Louver Top) -->
      <!-- Vertical Stem -->
      <rect x="204" y="198" width="26" height="118" rx="2" fill="url(#cyanGrad)" />
      <!-- Upper Diagonal Arm -->
      <path d="M 228 252 L 282 198 L 307 198 L 250 261 Z" fill="url(#cyanGrad)" />
      
      <!-- Architectural Building Crown / Louvers on K -->
      <rect x="272" y="178" width="30" height="6" rx="1.5" fill="url(#cyanGrad)" />
      <rect x="275" y="186" width="24" height="4.5" rx="1" fill="url(#cyanGrad)" />
      <rect x="278" y="192" width="18" height="4" rx="1" fill="url(#cyanGrad)" />

      <!-- Lower Diagonal Leg -->
      <path d="M 238 246 L 302 316 L 272 316 L 220 260 Z" fill="url(#cyanGrad)" />
    </g>
  </g>
</svg>