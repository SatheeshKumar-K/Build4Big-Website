<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient Matching Reference Image (media_1791058780328.png) -->
    <linearGradient id="bgLightClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="35%" stop-color="#f7faff"/>
      <stop offset="70%" stop-color="#edf4fc"/>
      <stop offset="100%" stop-color="#e8f2fc"/>
    </linearGradient>

    <!-- Ambient Sky & Maritime Mesh Gradients -->
    <radialGradient id="meshSky1" cx="20%" cy="22%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshSky2" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="meshSky3" cx="50%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#bae6fd" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Beacon Glow Filter -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dot-Matrix Grid Pattern (Exact replica of media_1791058780328.png) -->
    <pattern id="dotMatrixPattern" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1.6" fill="#93c5fd" opacity="0.68"/>
    </pattern>

    <style>
      /* Animated Streaming Dashed Routes */
      @keyframes dashRouteFlow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: -140; }
      }
      @keyframes radarPingWave {
        0% { r: 12px; opacity: 0.7; }
        50% { opacity: 0.35; }
        100% { r: 52px; opacity: 0; }
      }
      @keyframes beaconSoftPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .stream-route-1 {
        stroke-dasharray: 8, 6;
        animation: dashRouteFlow 7s linear infinite;
      }
      .stream-route-2 {
        stroke-dasharray: 8, 6;
        animation: dashRouteFlow 9s linear infinite;
      }
      .stream-route-3 {
        stroke-dasharray: 6, 6;
        animation: dashRouteFlow 11s linear infinite;
      }
      .radar-wave-anim {
        animation: radarPingWave 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        transform-origin: center;
      }
      .radar-wave-anim-delay {
        animation: radarPingWave 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) 1.75s infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- 1. Base Crisp Maritime Background Canvas -->
  <rect width="1920" height="1080" fill="url(#bgLightClean)"/>
  <rect width="1920" height="1080" fill="url(#meshSky1)"/>
  <rect width="1920" height="1080" fill="url(#meshSky2)"/>
  <rect width="1920" height="1080" fill="url(#meshSky3)"/>

  <!-- 2. Dot-Matrix Grid Layer (1:1 replica of media_1791058780328.png) -->
  <rect width="1920" height="1080" fill="url(#dotMatrixPattern)"/>

  <!-- 3. Navigation Latitude & Longitude Coordinate Lines -->
  <g stroke="#0284c7" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3,5">
    <line x1="0" y1="224" x2="1920" y2="224"/>
    <line x1="0" y1="448" x2="1920" y2="448"/>
    <line x1="0" y1="728" x2="1920" y2="728"/>
    <line x1="364" y1="0" x2="364" y2="1080"/>
    <line x1="1092" y1="0" x2="1092" y2="1080"/>
    <line x1="1624" y1="0" x2="1624" y2="1080"/>
  </g>

  <!-- 4. Subtle Blueprint Watermarks: Port Cranes & Container Ships -->
  <g fill="#0284c7" fill-opacity="0.04" stroke="#0284c7" stroke-opacity="0.07" stroke-width="1.4">
    <!-- Left Gantry Crane Blueprint (matching bottom-left of reference) -->
    <path d="M-20,960 L80,960 L65,480 L35,480 L0,960 Z"/>
    <line x1="50" y1="480" x2="310" y2="425" stroke-width="3"/>
    <line x1="50" y1="480" x2="-80" y2="510" stroke-width="2"/>
    <line x1="50" y1="480" x2="260" y2="380" stroke-width="1.2" stroke-dasharray="2,2"/>
    <rect x="130" y="445" width="24" height="18" rx="2"/>
    <line x1="142" y1="463" x2="142" y2="560" stroke-width="1.2"/>
    <line x1="-10" y1="840" x2="65" y2="700"/>
    <line x1="65" y1="840" x2="-10" y2="700"/>

    <!-- Right Shipping Gantry Silhouette -->
    <path d="M1940,940 L1840,940 L1858,460 L1885,460 L1915,940 Z"/>
    <line x1="1870" y1="460" x2="1620" y2="410" stroke-width="3"/>
    <line x1="1870" y1="460" x2="1980" y2="490" stroke-width="2"/>
    <line x1="1870" y1="460" x2="1660" y2="370" stroke-width="1.2" stroke-dasharray="2,2"/>

    <!-- Cargo Vessel Hull Silhouette Blueprint (Bottom Right) -->
    <g transform="translate(1380, 800)">
      <path d="M30,120 L440,120 L490,70 L10,70 L20,95 Z"/>
      <rect x="70" y="-20" width="60" height="90" rx="3"/>
      <rect x="85" y="-45" width="30" height="25" rx="2"/>
      <rect x="150" y="15" width="45" height="55" rx="2"/>
      <rect x="200" y="25" width="45" height="45" rx="2"/>
      <rect x="250" y="0" width="45" height="70" rx="2"/>
      <rect x="300" y="18" width="45" height="52" rx="2"/>
      <rect x="350" y="32" width="45" height="38" rx="2"/>
    </g>
  </g>

  <!-- 5. Animated Dashed Trajectory Route Lines (Exact replica of media_1791058780328.png) -->
  <g>
    <!-- Route 1: From Beacon 1 (364, 224) diagonally streaming down across grid -->
    <path d="M 364 224 L 1092 448 L 1624 308" fill="none" stroke="#38bdf8" stroke-width="2.6" class="stream-route-1"/>
    
    <!-- Route 2: Secondary Shipping Route (bottom right angle) -->
    <path d="M 840 896 L 1400 812 L 1840 644" fill="none" stroke="#38bdf8" stroke-width="2.4" class="stream-route-2" stroke-opacity="0.85"/>

    <!-- Route 3: Cross Inter-Modal Connecting Trajectory -->
    <path d="M 280 840 Q 650 680 1092 448" fill="none" stroke="#0ea5e9" stroke-width="2" class="stream-route-3" stroke-opacity="0.6"/>
  </g>

  <!-- 6. Radar Beacons with Expanding Waves (matching media_1791058780328.png) -->
  <!-- Beacon 1: Prominent Top-Left Node (Exact match to reference image screenshot) -->
  <g transform="translate(364, 224)">
    <!-- Expanding Radar Ripple Waves -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#38bdf8" stroke-width="1.8" class="radar-wave-anim"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#0ea5e9" stroke-width="1.5" class="radar-wave-anim-delay"/>
    <!-- Soft Cyan Translucent Radar Disc Aura -->
    <circle cx="0" cy="0" r="34" fill="#38bdf8" fill-opacity="0.25"/>
    <!-- Glowing Center Beacon Dot -->
    <circle cx="0" cy="0" r="7.5" fill="#0ea5e9" filter="url(#beaconGlow)"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Beacon 2: Mid-Continent Telemetry Node (1092, 448) -->
  <g transform="translate(1092, 448)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.6" class="radar-wave-anim"/>
    <circle cx="0" cy="0" r="28" fill="#38bdf8" fill-opacity="0.22"/>
    <circle cx="0" cy="0" r="6.5" fill="#0ea5e9" filter="url(#beaconGlow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Beacon 3: East Ocean Port Terminal (1624, 308) -->
  <g transform="translate(1624, 308)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-wave-anim"/>
    <circle cx="0" cy="0" r="26" fill="#38bdf8" fill-opacity="0.20"/>
    <circle cx="0" cy="0" r="6" fill="#0ea5e9" filter="url(#beaconGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Beacon 4: Southern Maritime Hub (1400, 812) -->
  <g transform="translate(1400, 812)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-wave-anim"/>
    <circle cx="0" cy="0" r="28" fill="#38bdf8" fill-opacity="0.20"/>
    <circle cx="0" cy="0" r="6.5" fill="#0ea5e9" filter="url(#beaconGlow)"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Beacon 5: Western Gateway Node (280, 840) -->
  <g transform="translate(280, 840)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" class="radar-wave-anim"/>
    <circle cx="0" cy="0" r="26" fill="#38bdf8" fill-opacity="0.18"/>
    <circle cx="0" cy="0" r="6" fill="#0ea5e9" filter="url(#beaconGlow)"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- 7. Subtle Grid Crosshair Marks & GPS Coordinate Watermarks -->
  <g stroke="#0284c7" stroke-opacity="0.25" stroke-width="1.2">
    <!-- Crosshairs on grid intersections -->
    <path d="M 644,220 L 644,228 M 640,224 L 648,224"/>
    <path d="M 1372,444 L 1372,452 M 1368,448 L 1376,448"/>
    <path d="M 812,724 L 812,732 M 808,728 L 816,728"/>
  </g>

</svg>
